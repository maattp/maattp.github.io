name = "cloudflare-backend"
main = "src/index.ts"
compatibility_date = "2026-03-01"

[[kv_namespaces]]
binding = "KV"
id = "695a2234a1704cf693385666f5ce902d"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "photos"

[[d1_databases]]
binding = "DB"
database_name = "photos-db"
database_id = "94b16b1f-ff69-4f23-b1d2-0df20febe2b3"

[vars]
GOOGLE_CLIENT_ID = "611505411727-94u34em16j7sd0rdigejmvfdgnjj67ma.apps.googleusercontent.com"
ALLOWED_EMAILS = "m.polkiewicz@gmail.com,ting520143@gmail.com"
# VAPID_PRIVATE_KEY is a secret: `wrangler secret put VAPID_PRIVATE_KEY`
# (and worker/.dev.vars for local dev — gitignored).
VAPID_PUBLIC_KEY = "BEh-HVZvaC3p5R3vm9vaddvI-SvWAJ2N6kcocMcyOcaWhLDEgVc5bQjzKT8knGN509v8GOGDujwu2OoQfwdKiLs"
VAPID_SUBJECT = "mailto:m.polkiewicz@gmail.com"
# RING_MCP_TOKEN (Pebble -> relay) and RING_WS_TOKEN (mini's socket) are
# secrets: `wrangler secret put RING_MCP_TOKEN` / `... RING_WS_TOKEN`.
# CHAT_CLAUDE_TOKEN (Claude -> chat) is a secret: `wrangler secret put CHAT_CLAUDE_TOKEN`.
# OPENROUTER_API_KEY (LLM app, free models only) is a secret: `wrangler secret put OPENROUTER_API_KEY`.
# CF_TURN_KEY_ID / CF_TURN_API_TOKEN (Space Flight TURN, optional): `wrangler secret put …`.
CHAT_SENDERS = "m.polkiewicz@gmail.com:matt,ting520143@gmail.com:tingting"

[durable_objects]
bindings = [
  { name = "KART3_ROOM", class_name = "Kart3Room" },
  { name = "F51_ROOM", class_name = "Fable51Room" },
  { name = "SF_ROOM", class_name = "SpaceRoom" },
  { name = "MAHJONG_ROOM", class_name = "MahjongRoom" },
  { name = "HARD_ROOM", class_name = "HardRoom" },
  { name = "RING_ROOM", class_name = "RingRoom" },
  { name = "CHAT_ROOM", class_name = "ChatRoom" },
]

[[migrations]]
