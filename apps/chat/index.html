<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://accounts.google.com; style-src 'unsafe-inline' https://accounts.google.com; img-src 'self' data:; connect-src https://cloudflare-backend.maattp.workers.dev wss://cloudflare-backend.maattp.workers.dev https://accounts.google.com; frame-src https://accounts.google.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon.png">
<title>Chat</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  /* ---------- palette ----------
     Warm neutrals rather than the old blue-black: a paper ground in light,
     a soft charcoal in dark, so the app reads as a room rather than a
     terminal. Three voices need to be told apart at a glance — me (teal),
     the other person (plain surface), Claude (amber, tinted + ruled). Every
     colour is defined here on :root; the dark block only redefines them. */
  :root {
    --ground:#f6f5f2; --surface:#fff; --raised:#eceae4; --line:#e2dfd8;
    --ink:#1b1a17; --dim:#77736b; --faint:#a8a49b;
    --me:#0f7a6b; --me-ink:#fff;
    --claude:#a5651c; --claude-bg:#fbf3e5; --claude-line:#ecd9b8;
    --segtrack:#eceae4; --segon:#fff;
    --shadow:0 1px 2px rgba(28,26,20,.06);
    --lift:0 6px 24px rgba(28,26,20,.14), 0 1px 3px rgba(28,26,20,.1);
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#111110; --surface:#1b1a18; --raised:#26251f; --line:#312f2a;
      --ink:#eceae4; --dim:#948f85; --faint:#6b675f;
      --me:#16806f; --me-ink:#fff;
      --claude:#dda45c; --claude-bg:#241d13; --claude-line:#44351f;
      --segtrack:#131210; --segon:#34322b;
      --shadow:none;
      --lift:0 8px 28px rgba(0,0,0,.55), 0 0 0 1px var(--line);
    }
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--ground); }
  body { color:var(--ink); overflow:hidden;
         font:16px/1.45 -apple-system,system-ui,"SF Pro Text",sans-serif;
         -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; }

  /* At rest the app IS the layout viewport: inset:0, nothing else. In a
     standalone app that is the whole screen, status bar to home indicator,
     and no JS touches it. layoutViewport() sets an inline height/transform
     only while the keyboard is up, and clears them the moment it is not. */
  #app { display:flex; flex-direction:column; position:fixed; inset:0; }
  /* keyboard up: it covers the home-indicator strip, so that inset is not
     ours to reserve */
  #app.kb #composer { padding-bottom:8px; }

  /* ---------- header ----------
     Two threads, so the switcher is a segmented control rather than a row of
     buttons that look like actions. It carries the thread name, which is why
     there is no separate title competing with it. */
  header { padding:calc(var(--sat) + 10px) 12px 10px; background:var(--surface);
           border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .tabs { flex:1; display:flex; gap:2px; padding:2px; background:var(--segtrack);
          border-radius:11px; }
  .tab { flex:1; position:relative; padding:7px 12px; border:none; border-radius:9px;
         background:none; color:var(--dim); font-size:14px; font-weight:590;
         letter-spacing:-.01em; transition:background .18s, color .18s; }
  .tab.active { background:var(--segon); color:var(--ink); box-shadow:var(--shadow); }
  .tab .badge { display:inline-block; min-width:17px; margin-left:5px; padding:0 5px;
                background:var(--me); color:var(--me-ink); border-radius:9px;
                font-size:11px; font-weight:700; line-height:17px; vertical-align:1px; }
  .tab.active .badge { background:var(--me); }
  #bell { flex:none; width:34px; height:34px; display:grid; place-items:center;
          background:var(--raised); border:none; border-radius:17px; font-size:15px;
          filter:grayscale(1) opacity(.55); transition:filter .2s; }
  #bell.on { filter:none; }

  /* ---------- message list ---------- */
  #scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
            display:flex; flex-direction:column; }
  #topspacer { margin-top:auto; flex-shrink:0; }
  #botspacer { padding-bottom:10px; } /* keep the last row's reactions off the composer edge */
  #botspacer,#list { flex-shrink:0; }
  #topspacer,#botspacer { width:1px; }

  /* One .msg is one virtualised row: whatever it contains — a day divider, a
     name, the bubble, reactions — is measured as this element's height, so
     nothing here may sit outside it. */
  .msg { padding:1px 14px; display:flex; flex-direction:column; }
  .msg.start { margin-top:12px; }        /* air between speakers */
  .msg.mine { align-items:flex-end; }
  .msg.theirs { align-items:flex-start; }

  .day { align-self:center; margin:14px 0 10px; padding:3px 12px; border-radius:11px;
         background:var(--raised); color:var(--dim); font-size:11px; font-weight:650;
         letter-spacing:.04em; text-transform:uppercase; }

  .who { margin:0 6px 3px; font-size:11.5px; font-weight:650; color:var(--dim);
         letter-spacing:.01em; }
  .msg.claude .who { color:var(--claude); }

  .bubble { max-width:80%; padding:9px 14px 10px; border-radius:20px;
            white-space:pre-wrap; word-break:break-word; font-size:16px; line-height:1.42;
            box-shadow:var(--shadow); }
  .msg.mine .bubble { background:var(--me); color:var(--me-ink); }
  .msg.theirs .bubble { background:var(--surface); }
  .msg.claude .bubble { background:var(--claude-bg); border:1px solid var(--claude-line); }
  /* Square off the inner corner only on the last bubble of a run, so a group
     reads as one block with a single tail. */
  .msg.mine.end .bubble { border-bottom-right-radius:7px; }
  .msg.theirs.end .bubble { border-bottom-left-radius:7px; }
  .msg.pending .bubble { opacity:.5; }


  /* ---------- reactions ----------
     The + is always drawn, one per message, so adding a reaction is a visible
     affordance rather than something you have to know. It stays quiet: faint
     until it is tapped. */
  .foot { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:4px 5px 0; }
  .msg.mine .foot { flex-direction:row-reverse; }
  .foot .time { font-size:10.5px; color:var(--faint); letter-spacing:.01em; }
  .chip { display:inline-flex; align-items:center; gap:4px; height:24px; padding:0 8px;
          background:var(--surface); border:1px solid var(--line); border-radius:12px;
          font-size:13px; line-height:1; box-shadow:var(--shadow); }
  .chip .n { font-size:11.5px; font-weight:650; color:var(--dim); }
  .chip.mine { border-color:var(--me); background:color-mix(in srgb, var(--me) 12%, var(--surface)); }
  .chip.mine .n { color:var(--me); }
  .addreact { width:24px; height:24px; display:grid; place-items:center; padding:0;
              background:var(--raised); border:none; border-radius:12px;
              color:var(--faint); font-size:15px; font-weight:600; line-height:1;
              transition:transform .12s, color .18s, background .18s; }
  .addreact:active { transform:scale(.86); }
  .addreact.open { background:var(--me); color:var(--me-ink); }

  /* ---------- emoji picker ---------- */
  #picker { position:fixed; display:none; z-index:10; gap:2px; padding:6px;
            background:var(--surface); border:1px solid var(--line); border-radius:25px;
            box-shadow:var(--lift);
            transform-origin:var(--ox,50%) bottom; animation:pop .16s cubic-bezier(.2,1.2,.5,1); }
  @keyframes pop { from { opacity:0; transform:scale(.8) translateY(6px); } }
  #picker button { width:42px; height:42px; display:grid; place-items:center; padding:0;
                   background:none; border:none; border-radius:21px; font-size:25px;
                   transition:transform .12s, background .15s; }
  #picker button:active { transform:scale(1.25); }
  #picker button.on { background:color-mix(in srgb, var(--me) 16%, transparent); }

  /* ---------- composer ---------- */
  #composer { display:flex; align-items:flex-end; gap:8px;
              padding:9px 12px calc(var(--sab) + 9px);
              background:var(--surface); border-top:1px solid var(--line); }
  #input { flex:1; min-height:38px; max-height:120px; padding:8px 15px; resize:none;
           background:var(--ground); border:1px solid var(--line); border-radius:19px;
           color:var(--ink); font:16px/1.4 inherit; }
  #input::placeholder { color:var(--faint); }
  #input:focus { outline:none; border-color:color-mix(in srgb, var(--me) 45%, var(--line)); }
  #sendbtn { flex:none; width:38px; height:38px; display:grid; place-items:center; padding:0;
             background:var(--me); color:var(--me-ink); border:none; border-radius:19px;
             font-size:17px; font-weight:700;
             transition:transform .14s, opacity .14s; }
  #sendbtn:disabled { background:var(--raised); color:var(--faint); }

  /* ---------- login ---------- */
  #login { position:fixed; inset:0; z-index:20; padding:32px;
           background:var(--ground); display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:14px; }
  #login .mark { width:62px; height:62px; margin-bottom:6px; display:grid; place-items:center;
                 background:var(--me); color:var(--me-ink); border-radius:20px;
                 font-size:30px; box-shadow:var(--lift); }
  #login h2 { font-size:25px; font-weight:700; letter-spacing:-.02em; }
  #login p { max-width:270px; color:var(--dim); font-size:14px; line-height:1.5; text-align:center; }
  #gbtn { margin-top:12px; min-height:44px; }

  #empty { padding:28px 32px; color:var(--faint); font-size:14px; text-align:center;
           line-height:1.6; white-space:pre-line; }

  .hidden { display:none !important; }
  #ver { position:fixed; bottom:calc(var(--sab) + 2px); right:7px; z-index:1;
         font-size:9px; color:var(--faint); opacity:.4; pointer-events:none; }
</style>
</head>
<body>
<div id="login">
  <div class="mark">✉︎</div>
  <h2>Chat</h2>
  <p>Matt, Tingting &amp; Claude. Sign in with the account you always use.</p>
  <div id="gbtn"></div>
</div>
<div id="app" class="hidden">
  <header>
    <div class="tabs" id="tabs"></div>
    <button id="bell" title="Enable notifications">🔔</button>
  </header>
  <div id="scroll"><div id="topspacer"></div><div id="list"></div><div id="botspacer"></div></div>
  <div id="composer">
    <textarea id="input" rows="1" placeholder="Message" maxlength="8000"></textarea>
    <button id="sendbtn" disabled aria-label="Send">↑</button>
  </div>
</div>
<div id="picker"></div>
<div id="ver">v9</div>

<script>
'use strict';
/* Chat v1 — see PLAN.md. Bump VERSION here and CACHE in sw.js together. */
const VERSION = 9;
const API = 'https://cloudflare-backend.maattp.workers.dev';
const CLIENT_ID = '611505411727-94u34em16j7sd0rdigejmvfdgnjj67ma.apps.googleusercontent.com';
const VAPID_PUBLIC = 'BEh-HVZvaC3p5R3vm9vaddvI-SvWAJ2N6kcocMcyOcaWhLDEgVc5bQjzKT8knGN509v8GOGDujwu2OoQfwdKiLs';
const SKEY = 'chat_session';
const PICK = ['❤️','👍','😂','😮','😢','🔥'];
const THREAD_LABELS = { dm: 'Claude', group: 'Us' };
// Device senders: Matt's own words arriving through a device credential.
// Rendered on his side of the chat, labelled with the device.
const DEVICE_OWNERS = { ring: 'matt', alexa: 'matt' };
const SENDER_LABELS = { claude: 'Claude', ring: '💍 Ring', alexa: '🔊 Alexa' };

/* ---------- tiny IndexedDB layer ---------- */
let db;
function idb() {
  return db ? Promise.resolve(db) : new Promise((res, rej) => {
    const r = indexedDB.open('chat', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('messages', { keyPath: 'id' }).createIndex('bySeq', ['thread','seq']);
      d.createObjectStore('reactions', { keyPath: ['message_id','sender','emoji'] }).createIndex('bySeq', ['thread','seq']);
      d.createObjectStore('outbox', { keyPath: 'id' });
      d.createObjectStore('meta', { keyPath: 'k' });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return idb().then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode); const s = t.objectStore(store);
    const out = fn(s);
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    t.onerror = () => rej(t.error);
  }));
}
const putAll = (store, rows) => rows.length ? tx(store, 'readwrite', s => rows.forEach(r => s.put(r))) : Promise.resolve();
function readIndexRange(store, thread) {
  return idb().then(d => new Promise((res, rej) => {
    const s = d.transaction(store).objectStore(store).index('bySeq');
    const q = s.getAll(IDBKeyRange.bound([thread, 0], [thread, Infinity]));
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  }));
}

/* ---------- state ---------- */
const S = {
  session: localStorage.getItem(SKEY) || null,
  me: null, threads: [], thread: null,
  msgs: {},          // thread -> array sorted by seq
  reacts: {},        // thread -> Map(message_id -> Map(emoji -> Set(sender)))
  lastSeq: {}, unread: {}, hasMore: {}, ws: null, wsBackoff: 1000, online: false,
};

/* ---------- api ---------- */
async function api(method, path, body) {
  const res = await fetch(API + '/chat' + path, {
    method,
    headers: { Authorization: 'Bearer ' + S.session, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { localStorage.removeItem(SKEY); location.reload(); throw new Error('unauthorized'); }
  if (!res.ok) { const e = new Error('api ' + res.status); e.status = res.status; throw e; }
  return res.json();
}

/* ---------- auth ---------- */
window.onGoogleLibraryLoad = () => {
  if (S.session) return;
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential });
  google.accounts.id.renderButton(document.getElementById('gbtn'), {
    theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'filled_black' : 'outline',
    size: 'large', shape: 'pill',
  });
};
async function onCredential(response) {
  const res = await fetch(API + '/auth', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: response.credential }),
  });
  if (!res.ok) { alert('Sign-in rejected'); return; }
  const data = await res.json();
  S.session = data.sessionId; localStorage.setItem(SKEY, S.session);
  init();
}

/* ---------- reactions bookkeeping ---------- */
function reactMap(thread) { return S.reacts[thread] || (S.reacts[thread] = new Map()); }
function applyReaction(thread, r) {
  const m = reactMap(thread);
  if (!m.has(r.message_id)) m.set(r.message_id, new Map());
  const per = m.get(r.message_id);
  if (!per.has(r.emoji)) per.set(r.emoji, new Set());
  const removed = r.removed ?? (r.removed_at != null);
  if (removed) { per.get(r.emoji).delete(r.sender); if (!per.get(r.emoji).size) per.delete(r.emoji); }
  else per.get(r.emoji).add(r.sender);
}

/* ---------- sync ---------- */
async function loadLocal(thread) {
  S.msgs[thread] = (await readIndexRange('messages', thread)).sort((a, b) => a.seq - b.seq);
  const rs = await readIndexRange('reactions', thread);
  for (const r of rs) applyReaction(thread, r);
  const meta = await tx('meta', 'readonly', s => s.get('seq:' + thread));
  S.lastSeq[thread] = meta ? meta.v : (S.msgs[thread].at(-1)?.seq ?? 0);
  S.hasMore[thread] = S.msgs[thread].length > 0; // until a short page proves otherwise
  // Fresh install: don't replay a 20k-message thread forward from seq 0 —
  // take the newest page and set the cursor to the thread's true top
  // (review issue #3; PLAN "Cold start").
  if (!S.msgs[thread].length && !S.lastSeq[thread]) {
    try {
      const got = await api('GET', `/${thread}/messages?limit=100`);
      const rows = got.messages.sort((a, b) => a.seq - b.seq);
      S.msgs[thread] = rows;
      putAll('messages', rows);
      for (const r of got.reactions) applyReaction(thread, { ...r, thread });
      putAll('reactions', got.reactions.map(r => ({ ...r, thread, removed_at: null })));
      S.lastSeq[thread] = got.top || (rows.at(-1)?.seq ?? 0);
      tx('meta', 'readwrite', s => s.put({ k: 'seq:' + thread, v: S.lastSeq[thread] }));
      S.hasMore[thread] = got.messages.length === 100;
    } catch { /* offline fresh install: nothing to show yet */ }
  }
}
let loadingOlder = false;
async function loadOlder() {
  const t = S.thread;
  if (loadingOlder || !S.hasMore[t] || !S.msgs[t]?.length) return;
  loadingOlder = true;
  try {
    const got = await api('GET', `/${t}/messages?before=${S.msgs[t][0].seq}&limit=100`);
    S.hasMore[t] = got.messages.length === 100;
    const known = new Set(S.msgs[t].map(m => m.id));
    const fresh = got.messages.filter(m => !known.has(m.id)).sort((a, b) => a.seq - b.seq);
    if (fresh.length) {
      S.msgs[t] = fresh.concat(S.msgs[t]);
      putAll('messages', fresh);
      for (const r of got.reactions) applyReaction(t, { ...r, thread: t });
      putAll('reactions', got.reactions.map(r => ({ ...r, thread: t, removed_at: null })));
      const scroll = document.getElementById('scroll');
      prefixDirty = true; rebuildPrefix();
      const added = fresh.reduce((a, m) => a + (heights.get(m.id) || EST), 0);
      const keep = scroll.scrollTop + added;   // anchor: don't yank the viewport
      render(false);
      scroll.scrollTop = keep;
    }
  } catch { /* offline; retry on next scroll */ }
  finally { loadingOlder = false; }
}
async function catchUp(thread) {
  let got;
  do {
    got = await api('GET', `/${thread}/messages?after=${S.lastSeq[thread]}&limit=200`);
    ingest(thread, got.messages, got.reactions, got.next);
  } while (got.more);
}
function ingest(thread, messages, reactions, next) {
  let top = S.lastSeq[thread];
  if (messages.length) {
    // Remove pending placeholders FIRST, then dedupe — otherwise the
    // placeholder's id shadows the confirmed row and the message vanishes.
    for (const m of messages) removePending(thread, m.id);
    const known = new Set(S.msgs[thread].map(m => m.id));
    for (const m of messages) if (!known.has(m.id)) S.msgs[thread].push(m);
    S.msgs[thread].sort((a, b) => a.seq - b.seq);
    putAll('messages', messages);
    top = Math.max(top, messages.at(-1).seq);
  }
  if (reactions && reactions.length) {
    for (const r of reactions) applyReaction(thread, { ...r, thread });
    putAll('reactions', reactions.map(r => ({ ...r, thread })));
    top = Math.max(top, reactions.at(-1).seq);
  }
  // The server's merged-stream cursor is authoritative when present: it
  // guarantees everything <= next was delivered (review issue #2).
  if (typeof next === 'number') top = Math.max(S.lastSeq[thread], next);
  if (top > S.lastSeq[thread]) {
    S.lastSeq[thread] = top;
    tx('meta', 'readwrite', s => s.put({ k: 'seq:' + thread, v: top }));
  }
  if (thread === S.thread) render(true); else { S.unread[thread] = (S.unread[thread] || 0) + messages.length; renderTabs(); }
}

/* ---------- websocket ---------- */
async function connectWS() {
  if (!S.thread) return;
  const thread = S.thread;
  try {
    const { ticket } = await api('POST', `/${thread}/ws-ticket`);
    const ws = new WebSocket(API.replace('https', 'wss') + '/chat/ws?ticket=' + ticket);
    S.ws = ws;
    ws.onopen = () => { S.wsBackoff = 1000; setOnline(true); catchUp(thread).catch(() => {}); };
    ws.onmessage = (e) => {
      const d = JSON.parse(e.data);
      if (d.type === 'ping') return;
      if (d.type === 'message') ingest(thread, [d.message], []);
      if (d.type === 'reaction') ingest(thread, [], [d.reaction]);
    };
    ws.onclose = () => {
      setOnline(false);
      if (S.ws === ws && S.thread === thread) { setTimeout(connectWS, S.wsBackoff); S.wsBackoff = Math.min(S.wsBackoff * 2, 30000); }
    };
  } catch { setOnline(false); setTimeout(connectWS, S.wsBackoff); S.wsBackoff = Math.min(S.wsBackoff * 2, 30000); }
}
/* Connection state is internal — a chat app doesn't narrate its socket.
   Messages sent while down queue in the outbox and flush on reconnect. */
function setOnline(v) {
  S.online = v;
  if (v) flushOutbox();
}

/* ---------- outbox / send ---------- */
async function send() {
  const input = document.getElementById('input');
  const body = input.value.trim();
  if (!body || !S.thread) return;
  input.value = ''; input.style.height = 'auto'; syncSend();
  const item = { id: crypto.randomUUID(), thread: S.thread, body, clientAt: Date.now() };
  await tx('outbox', 'readwrite', s => s.put(item));
  S.msgs[S.thread].push({ ...item, seq: Infinity, sender: S.me, created_at: item.clientAt, pending: true });
  render(true);
  flushOutbox();
}
let flushing = false, flushAgain = false;
async function flushOutbox() {
  if (flushing) { flushAgain = true; return; }
  flushing = true;
  try {
    const items = await tx('outbox', 'readonly', s => s.getAll());
    for (const it of (items || [])) {
      try {
        await api('POST', `/${it.thread}/send`, { id: it.id, body: it.body, clientAt: it.clientAt });
        await tx('outbox', 'readwrite', s => s.delete(it.id));
      } catch (e) {
        // Permanent rejection (too long, bad request): drop it — retrying
        // forever would wedge every send queued behind it.
        if (e.status && e.status >= 400 && e.status < 500 && e.status !== 401 && e.status !== 429) {
          await tx('outbox', 'readwrite', s => s.delete(it.id));
          removePending(it.thread, it.id); if (it.thread === S.thread) render(false);
          continue;
        }
        break; // offline / transient; keep the rest queued
      }
    }
  } finally { flushing = false; if (flushAgain) { flushAgain = false; flushOutbox(); } }
}
function removePending(thread, id) {
  const arr = S.msgs[thread]; const i = arr.findIndex(m => m.pending && m.id === id);
  if (i >= 0) arr.splice(i, 1);
}

/* ---------- virtualised list ---------- */
const EST = 72, OVERSCAN = 800;
const heights = new Map(); let prefix = [], prefixDirty = true;
function rebuildPrefix() {
  const arr = S.msgs[S.thread] || []; prefix = new Array(arr.length + 1); prefix[0] = 0;
  for (let i = 0; i < arr.length; i++) prefix[i + 1] = prefix[i] + (heights.get(arr[i].id) || EST);
  prefixDirty = false;
}
function findIdx(y) { // greatest i with prefix[i] <= y
  let lo = 0, hi = prefix.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (prefix[mid] <= y) lo = mid; else hi = mid - 1; }
  return lo;
}
function render(stickBottom) {
  if (pickerClose) pickerClose();   // its anchor is about to be replaced
  const scroll = document.getElementById('scroll'), list = document.getElementById('list');
  const arr = S.msgs[S.thread] || [];
  if (prefixDirty) rebuildPrefix();
  const wasBottom = scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 60;
  const y = scroll.scrollTop;
  let start = Math.max(0, findIdx(Math.max(0, y - OVERSCAN)));
  let end = Math.min(arr.length, findIdx(y + scroll.clientHeight + OVERSCAN) + 1);
  if (stickBottom && (wasBottom || arr.at(-1)?.pending)) { end = arr.length; start = Math.max(0, end - 60); }
  document.getElementById('topspacer').style.height = prefix[start] + 'px';
  document.getElementById('botspacer').style.height = (prefix[arr.length] - prefix[end]) + 'px';

  list.textContent = '';
  if (!arr.length) {
    const e = document.createElement('div'); e.id = 'empty';
    e.textContent = S.thread === 'dm' ? 'Just you and Claude.\nSay something.' : 'Nothing here yet.';
    list.appendChild(e);
  }
  const frag = document.createDocumentFragment();
  for (let i = start; i < end; i++) frag.appendChild(renderMsg(arr[i], arr[i - 1], arr[i + 1]));
  list.appendChild(frag);

  let changed = false;
  for (const el of list.children) {
    const h = el.offsetHeight, id = el.dataset.id;
    if (id && heights.get(id) !== h) { heights.set(id, h); changed = true; }
  }
  if (changed) { prefixDirty = true; rebuildPrefix();
    document.getElementById('topspacer').style.height = prefix[start] + 'px';
    document.getElementById('botspacer').style.height = (prefix[arr.length] - prefix[end]) + 'px'; }
  if (stickBottom && (wasBottom || arr.at(-1)?.pending)) scroll.scrollTop = scroll.scrollHeight;
  markRead();
}
/* Runs are the unit of layout: consecutive messages from one sender, close in
   time, on one day. The name is drawn once at the top of a run and the clock
   once at the bottom, so a burst of three messages costs three bubbles rather
   than three headers. */
const RUN_GAP = 15 * 60 * 1000;
const dayKey = (t) => new Date(t).toDateString();
function sameRun(a, b) {
  return a && b && a.sender === b.sender
      && Math.abs(b.created_at - a.created_at) < RUN_GAP
      && dayKey(a.created_at) === dayKey(b.created_at);
}
function dayLabel(t) {
  const d = new Date(t), now = new Date();
  const days = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  return d.toLocaleDateString([], days < 7
    ? { weekday: 'long' }
    : { weekday: 'short', month: 'short', day: 'numeric' });
}
const clock = (t) => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

function renderMsg(m, prev, next) {
  const div = document.createElement('div');
  div.dataset.id = m.id;
  const ownMsg = m.sender === S.me || DEVICE_OWNERS[m.sender] === S.me;
  const runStart = !sameRun(prev, m), runEnd = !sameRun(m, next);
  const newDay = !prev || dayKey(prev.created_at) !== dayKey(m.created_at);
  div.className = 'msg ' + (ownMsg ? 'mine' : m.sender === 'claude' ? 'claude theirs' : 'theirs')
    + (runStart ? ' start' : '') + (runEnd ? ' end' : '') + (m.pending ? ' pending' : '');

  // The divider lives INSIDE the row so the virtualiser measures it as part of
  // this row's height — anything outside .msg would not be accounted for.
  if (newDay) {
    const d = document.createElement('div'); d.className = 'day';
    d.textContent = dayLabel(m.created_at);
    div.appendChild(d);
  }
  // A device sender (ring, alexa) is Matt's own words arriving through a
  // gadget: it sits on his side, but the gadget is still worth naming.
  if (runStart && (!ownMsg || m.sender !== S.me)) {
    const who = document.createElement('div'); who.className = 'who';
    who.textContent = SENDER_LABELS[m.sender] || m.sender.charAt(0).toUpperCase() + m.sender.slice(1);
    div.appendChild(who);
  }
  const b = document.createElement('div'); b.className = 'bubble';
  b.textContent = m.body;   // text nodes only — never innerHTML (PLAN: security)
  div.appendChild(b);

  // Footer: chips, the +, the clock — one row, not three stacked ones. Order
  // in the DOM is chips → + → time; .msg.mine reverses it so the clock always
  // ends up on the outside edge of the bubble it belongs to.
  const foot = document.createElement('div'); foot.className = 'foot';
  const per = m.pending ? null : reactMap(S.thread).get(m.id);
  if (per) for (const [emoji, senders] of per) {
    if (!senders.size) continue;
    const chip = document.createElement('button'); chip.type = 'button';
    chip.className = 'chip' + (senders.has(S.me) ? ' mine' : '');
    chip.appendChild(document.createTextNode(emoji));
    if (senders.size > 1) {
      const n = document.createElement('span'); n.className = 'n';
      n.textContent = senders.size; chip.appendChild(n);
    }
    chip.onclick = (e) => { e.stopPropagation(); toggleReact(m.id, emoji, senders.has(S.me)); };
    foot.appendChild(chip);
  }
  // A pending message has no server row yet, so there is nothing to react to.
  if (!m.pending) {
    const add = document.createElement('button');
    add.className = 'addreact'; add.type = 'button';
    add.setAttribute('aria-label', 'Add reaction');
    add.textContent = '+';
    add.onclick = (e) => { e.stopPropagation(); showPicker(m, add); };
    foot.appendChild(add);
  }
  let when = '';
  if (m.client_at && m.created_at - m.client_at > 5 * 60 * 1000) when = 'sent ' + clock(m.created_at) + ' · composed ' + clock(m.client_at);
  else if (runEnd && !m.pending) when = clock(m.created_at);
  if (when) {
    const time = document.createElement('span'); time.className = 'time';
    time.textContent = when; foot.appendChild(time);
  }
  div.appendChild(foot);

  return div;
}
async function toggleReact(messageId, emoji, mine) {
  // explicit add/remove per PLAN — the UI decides which, the wire op is never "toggle"
  applyReaction(S.thread, { message_id: messageId, sender: S.me, emoji, removed: mine }); render(false);
  try { await api('POST', `/${S.thread}/react`, { messageId, emoji, op: mine ? 'remove' : 'add' }); }
  catch { applyReaction(S.thread, { message_id: messageId, sender: S.me, emoji, removed: !mine }); render(false); }
}
/* Anchored to the + that opened it, flipped below when there is no room
   above, and clamped to the viewport by MEASURED width — the old version
   subtracted a hardcoded 260px, which was wrong the moment the row changed. */
let pickerClose = null;
function showPicker(m, anchor) {
  if (pickerClose) pickerClose();
  const p = document.getElementById('picker');
  p.textContent = '';
  const per = reactMap(S.thread).get(m.id);
  for (const emoji of PICK) {
    const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = emoji;
    const mine = !!per?.get(emoji)?.has(S.me);
    if (mine) btn.className = 'on';
    btn.onclick = (ev) => { ev.stopPropagation(); close(); toggleReact(m.id, emoji, mine); };
    p.appendChild(btn);
  }
  p.style.display = 'flex';
  anchor.classList.add('open');

  const a = anchor.getBoundingClientRect();
  const w = p.offsetWidth, h = p.offsetHeight;   // layout size: the pop animation's scale() is not in it
  const pad = 8;
  const left = Math.min(window.innerWidth - w - pad, Math.max(pad, a.left + a.width / 2 - w / 2));
  const above = a.top - h - 8;
  p.style.left = left + 'px';
  p.style.top = (above >= pad ? above : Math.min(window.innerHeight - h - pad, a.bottom + 8)) + 'px';
  // grow from the + rather than from the middle of the sheet
  p.style.setProperty('--ox', (a.left + a.width / 2 - left) + 'px');

  function close() {
    p.style.display = 'none';
    anchor.classList.remove('open');
    document.removeEventListener('click', onDoc, true);
    document.getElementById('scroll').removeEventListener('scroll', close);
    pickerClose = null;
  }
  function onDoc(ev) { if (!p.contains(ev.target)) close(); }
  pickerClose = close;
  setTimeout(() => {
    document.addEventListener('click', onDoc, true);
    document.getElementById('scroll').addEventListener('scroll', close, { once: true });
  }, 0);
}

/* ---------- read cursor ---------- */
let readTimer;
function markRead() {
  clearTimeout(readTimer);
  readTimer = setTimeout(() => {
    const t = S.thread; if (!t || document.hidden) return;
    S.unread[t] = 0; renderTabs();
    api('POST', `/${t}/read`, { lastSeq: S.lastSeq[t] }).catch(() => {});
  }, 800);
}

/* ---------- push ---------- */
async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { alert('Push needs the app installed to your home screen.'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') return;
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(VAPID_PUBLIC) });
  const j = sub.toJSON();
  await api('POST', '/push/subscribe', { endpoint: j.endpoint, keys: j.keys });
  document.getElementById('bell').classList.add('on');
}
function b64uToBytes(s) {
  const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}

/* ---------- tabs / boot ---------- */
function renderTabs() {
  const tabs = document.getElementById('tabs'); tabs.textContent = '';
  for (const t of S.threads) {
    const b = document.createElement('button');
    b.className = 'tab' + (t === S.thread ? ' active' : '');
    b.textContent = THREAD_LABELS[t] || t;
    if (S.unread[t]) { const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = S.unread[t]; b.appendChild(badge); }
    b.onclick = () => switchThread(t);
    tabs.appendChild(b);
  }
}
async function switchThread(t) {
  if (S.thread === t) return;
  S.thread = t; localStorage.setItem('chat_thread', t);
  heights.clear(); prefixDirty = true;
  try { S.ws?.close(); } catch {}
  renderTabs();
  if (!S.msgs[t]) await loadLocal(t);
  render(true);
  connectWS();
}
async function init() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  let me;
  try { me = await api('GET', '/me'); }
  catch (e) { if (!navigator.onLine) { me = JSON.parse(localStorage.getItem('chat_me') || 'null'); } if (!me) throw e; }
  localStorage.setItem('chat_me', JSON.stringify(me));
  S.me = me.sender; S.threads = me.threads;
  const saved = localStorage.getItem('chat_thread');
  await switchThread(S.threads.includes(saved) ? saved : S.threads[0]);
  registerSW();
  if (Notification.permission === 'granted') document.getElementById('bell').classList.add('on');
}

/* ---------- service worker ----------
   A new worker taking over means a new shell is in the cache, but the page on
   screen is still the old one. Reload into it: at once if the app has only
   just launched or is in the background, otherwise the next time it is
   backgrounded — never under the user's thumbs. Not on the very first
   install: there is no old shell, and it would interrupt sign-in. */
async function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;
    const go = () => location.reload();
    if (document.hidden || performance.now() < 5000) go();
    else document.addEventListener('visibilitychange', () => { if (document.hidden) go(); }, { once: true });
  });
  const reg = await navigator.serviceWorker.register('sw.js');
  // iOS only checks for a new worker on navigation, and a standalone app
  // rarely navigates — so also check each time it comes to the foreground.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
}

/* ---------- wiring ---------- */
document.getElementById('sendbtn').onclick = send;
document.getElementById('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
document.getElementById('input').addEventListener('input', function () {
  this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  syncSend();
});
function syncSend() {
  const input = document.getElementById('input');
  document.getElementById('sendbtn').disabled = !input.value.trim();
}
document.getElementById('bell').onclick = enablePush;
document.getElementById('scroll').addEventListener('scroll', () => {
  render(false);
  if (document.getElementById('scroll').scrollTop < 600) loadOlder();
}, { passive: true });
window.addEventListener('online', () => { flushOutbox(); connectWS(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.thread) { flushOutbox(); catchUp(S.thread).catch(() => {}); markRead(); } });
/* ---------- geometry ----------
   Two viewports matter. The LAYOUT viewport is what inset:0 fills; in a
   standalone app it is the full screen, so at rest CSS alone is correct and
   JS must leave the box alone — every inline height we have ever set at rest
   has ended up as a band of body background under the composer.

   The VISUAL viewport (window.visualViewport) is what iOS actually shows.
   When the keyboard opens in a standalone app iOS does not resize the layout
   viewport; it shrinks the visual one and pans the page so the focused input
   is visible, which drags a fixed element's top off-screen. Only then do we
   intervene: size the app to the visible region and translate it back by the
   pan, then undo the pan.

   iOS does not promise that the visual viewport equals the layout viewport
   at rest — on notched phones it can report it short by the status-bar
   inset, with a matching offsetTop. So nothing here compares vv to
   innerHeight with a magic threshold (v3 used 60px; a 62px inset trips it
   at rest, and that is the black bar). Instead the rest geometry is
   MEASURED whenever the keyboard is down and used as the reference frame:
   keyboard up  <=>  vv.height is at least KB_MIN shorter than it was at rest
   (no iOS keyboard is shorter than ~216pt). Everything the keyboard changed
   is then the difference from that frame. */
const KB_MIN = 150;
let rest = null; // { h, top } of the visual viewport with no keyboard
function layoutViewport() {
  const vv = window.visualViewport; if (!vv) return;
  const app = document.getElementById('app');
  if (!rest) rest = { h: vv.height, top: vv.offsetTop };
  const kb = vv.height < rest.h - KB_MIN;
  if (kb) {
    // visible region, expressed relative to the rest frame
    app.style.height = (vv.height + (window.innerHeight - rest.h)) + 'px';
    app.style.transform = `translateY(${vv.offsetTop - rest.top}px)`;
  } else {
    rest = { h: vv.height, top: vv.offsetTop }; // track rotation etc.
    app.style.height = '';
    app.style.transform = '';
  }
  app.classList.toggle('kb', kb);
  window.scrollTo(0, 0);
  if (S.thread) render(false);
  // The keyboard halves the list's height; keep the newest messages next to
  // the composer instead of leaving the view mid-history.
  if (kb && document.activeElement === document.getElementById('input')) {
    const scroll = document.getElementById('scroll');
    scroll.scrollTop = scroll.scrollHeight;
  }
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', layoutViewport);
  visualViewport.addEventListener('scroll', layoutViewport);
  window.addEventListener('orientationchange', () => { rest = null; setTimeout(layoutViewport, 100); });
  layoutViewport(); // measure the rest frame before any keyboard can appear
}
document.getElementById('input').addEventListener('focus', () => setTimeout(layoutViewport, 250));
document.getElementById('input').addEventListener('blur', () => setTimeout(layoutViewport, 250));
if (S.session) init();
</script>
